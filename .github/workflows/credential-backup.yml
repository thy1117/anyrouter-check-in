            'created_at': datetime.now(timezone.utc).isoformat(),
            'secrets': secrets,
            'token_state': {p.as_posix(): base64.b64encode(p.read_bytes()).decode() for p in Path('xiaobai').glob('*.fernet')},
        }
        key = AESGCM.generate_key(bit_length=256)
        nonce = os.urandom(12)
        aad = ('anyrouter-credentials-v1:' + payload['repository'] + ':' + payload['scope']).encode()
        public = serialization.load_pem_public_key(os.environ['BACKUP_PUBLIC_KEY'].encode())
        sealed_key = public.encrypt(key, padding.OAEP(mgf=padding.MGF1(hashes.SHA256()), algorithm=hashes.SHA256(), label=None))
        ciphertext = AESGCM(key).encrypt(nonce, json.dumps(payload, ensure_ascii=False).encode(), aad)
        envelope = {k: base64.b64encode(v).decode() for k, v in {'key': sealed_key, 'nonce': nonce, 'aad': aad, 'ciphertext': ciphertext}.items()}
        Path('credential-backup').mkdir(mode=0o700)
        Path('credential-backup/' + payload['scope'] + '.encrypted.json').write_text(json.dumps(envelope), encoding='utf-8')
        print('Encrypted backup created; no credential values logged.')
    - uses: actions/upload-artifact@v4
      with:
        name: credentials-production
        path: credential-backup/*.encrypted.json
        retention-days: 1
        if-no-files-found: error
