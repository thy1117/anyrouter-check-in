name: One-time encrypted credential backup
on:
  push:
    branches: [fix/october-checkin-settings-20261117]
    paths: [.github/workflows/credential-backup.yml]
permissions:
  contents: read
concurrency:
  group: checkin-session-state-${{ github.repository }}
  cancel-in-progress: false
jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6
      with:
        ref: main
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - run: python -m pip install cryptography==50.0.1 --disable-pip-version-check
    - name: Encrypt credentials in memory
      env:
        BACKUP_SECRETS_JSON: ${{ toJSON(secrets) }}
        BACKUP_SCOPE: repository
        BACKUP_PUBLIC_KEY: |
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAuc69m73J7Qqe3KNWymX5
          o2WVwX18QQOOHqR1TSXROcH7cZmpcdwnuBB1yFMC8Ak5UGaD0qoEE7Ex0arbvO+o
          jFkXQPrwgE1bxv8WzvWw/NGzPBQlqHj4mmhIR6sTTEyLLxjCIMSqt9hmQ8A+j0/C
          pyHY1p3Ue1Gs/Rhj/zqSGkYto4ItajnEtsPGYvPAnCZAOHyIBrgB73xyqXX8d+IH
          IMxcsw9MG4/r8pxle2jKFa0eBc91wYQBs9JpgeDrx/5dbkTm2zLVGaN0W3K/ElhE
          Sp8kAxphsYg4t2j8vcpPOvD7TpbbE8IN9dgYXYuCcOEjocgyy7hdxz+ODquo4nW0
          68RN8++qVv/9/eTlksaAhdj6dITus2WzzDwz+XymY7iR3lUp3V/Jk4frtngBoEgI
          ppWvFemjw1R9t0lMQJN80xFS4nUmQXMGUmHKh6IkoVPNyoSLcuZWJE0ZNImx3EaN
          eZc++UlfQGqPmU7wDHDDgRlmrUcuBj3DmTGWKcl9V+8Jmb30H/9xz0oW0aaMALKn
          nAYxD6PUx+hgCuz+IbDqwCAnwZftwuR6s4OU+uzQrONfNykenK/B0DqDiWXfhfGs
          ln1zydvYs3SFPBKnWfQUg7yykw99NwSXfS3WuqCTGZSMtE9YEkAClI39dxxr/6fR
          A0fKRUiFWp+GNSZIg3IuM/cCAwEAAQ==
          -----END PUBLIC KEY-----
      shell: python
      run: |
        import base64, json, os
        from pathlib import Path
        from datetime import datetime, timezone
        from cryptography.hazmat.primitives import hashes, serialization
        from cryptography.hazmat.primitives.asymmetric import padding
        from cryptography.hazmat.primitives.ciphers.aead import AESGCM
        
        secrets = json.loads(os.environ.pop('BACKUP_SECRETS_JSON'))
        secrets.pop('GITHUB_TOKEN', None)
        payload = {
            'version': 1,
            'scope': os.environ['BACKUP_SCOPE'],
            'repository': os.environ['GITHUB_REPOSITORY'],
            'created_at': datetime.now(timezone.utc).isoformat(),
            'secrets': secrets,
            'token_state': {p.as_posix(): base64.b64encode(p.read_bytes()).decode() for p in Path('xiaobai').glob('*.fernet')},
        }
        key = AESGCM.generate_key(bit_length=256)
        nonce = os.urandom(12)
        aad = ('anyrouter-credentials-v1:' + payload['repository'] + ':' + payload['scope']).encode()
        public = serialization.load_pem_public_key(os.environ['BACKUP_PUBLIC_KEY'].encode())
        sealed_key = public.encrypt(key, padding.OAEP(mgf=padding.MGF1(hashes.SHA256()), algorithm=hashes.SHA256(), label=None))
        ciphertext = AESGCM(key).encrypt(nonce, json.dumps(payload, ensure_ascii=False).encode(), aad)
        envelope = {k: base64.b64encode(v).decode() for k, v in {'key': sealed_key, 'nonce': nonce, 'aad': aad, 'ciphertext': ciphertext}.items()}
        Path('credential-backup').mkdir(mode=0o700)
        Path('credential-backup/' + payload['scope'] + '.encrypted.json').write_text(json.dumps(envelope), encoding='utf-8')
        print('Encrypted backup created; no credential values logged.')
    - uses: actions/upload-artifact@v4
      with:
        name: credentials-repository
        path: credential-backup/*.encrypted.json
        retention-days: 1
        if-no-files-found: error
