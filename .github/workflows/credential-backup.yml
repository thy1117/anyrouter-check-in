          o2WVwX18QQOOHqR1TSXROcH7cZmpcdwnuBB1yFMC8Ak5UGaD0qoEE7Ex0arbvO+o
          jFkXQPrwgE1bxv8WzvWw/NGzPBQlqHj4mmhIR6sTTEyLLxjCIMSqt9hmQ8A+j0/C
          pyHY1p3Ue1Gs/Rhj/zqSGkYto4ItajnEtsPGYvPAnCZAOHyIBrgB73xyqXX8d+IH
          IMxcsw9MG4/r8pxle2jKFa0eBc91wYQBs9JpgeDrx/5dbkTm2zLVGaN0W3K/ElhE
          Sp8kAxphsYg4t2j8vcpPOvD7TpbbE8IN9dgYXYuCcOEjocgyy7hdxz+ODquo4nW0
          68RN8++qVv/9/eTlksaAhdj6dITus2WzzDwz+XymY7iR3lUp3V/Jk4frtngBoEgI
          ppWvFemjw1R9t0lMQJN80xFS4nUmQXMGUmHKh6IkoVPNyoSLcuZWJE0ZNImx3EaN
          eZc++UlfQGqPmU7wDHDDgRlmrUcuBj3DmTGWKcl9V+8Jmb30H/9xz0oW0aaMALKn
          nAYxD6PUx+hgCuz+IbDqwCAnwZftwuR6s4OU+uzQrONfNykenK/B0DqDiWXfhfGs
          ln1zydvYs3SFPBKnWfQUg7yykw99NwSXfS3WuqCTGZSMtE9YEkAClI39dxxr/6fR
          A0fKRUiFWp+GNSZIg3IuM/cCAwEAAQ==
          -----END PUBLIC KEY-----
      shell: python
      run: |
        import base64, json, os
        from pathlib import Path
        from datetime import datetime, timezone
        from cryptography.hazmat.primitives import hashes, serialization
        from cryptography.hazmat.primitives.asymmetric import padding
        from cryptography.hazmat.primitives.ciphers.aead import AESGCM
        
        secrets = json.loads(os.environ.pop('BACKUP_SECRETS_JSON'))
        secrets.pop('GITHUB_TOKEN', None)
        payload = {
