name: Nexa 5237 isolated status
on:
  workflow_dispatch:
concurrency:
  group: checkin-session-state-${{ github.repository }}
  cancel-in-progress: false
jobs:
  nexa5237-status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      with:
        version: latest
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - run: uv sync --frozen --no-dev
    - name: Read identity and today's Nexa 5237 status only
      env:
        PYTHONUNBUFFERED: '1'
        XIAOBAI_TOKEN_STATE_KEY: ${{ secrets.XIAOBAI_TOKEN_STATE_KEY }}
        XIAOBAI_STATE_GITHUB_TOKEN: ${{ github.token }}
        PROVIDERS: ${{ secrets.PROVIDERS }}
        EXTRA_PROVIDERS: ${{ secrets.EXTRA_PROVIDERS }}
        EXTRA_ACCOUNTS_64: ${{ secrets.EXTRA_ACCOUNTS_64 }}
        EXTRA_ACCOUNTS_65: ${{ secrets.EXTRA_ACCOUNTS_65 }}
      run: uv run python -m scripts.check_nexa5237_status
    - name: Upload status result
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nexa5237-status
        path: nexa5237-status.json
        if-no-files-found: warn
        retention-days: 3
