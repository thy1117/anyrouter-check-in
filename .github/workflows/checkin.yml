name: Four failed accounts - route diagnostic
'on':
  workflow_dispatch: {}
concurrency:
  group: checkin-session-state-${{ github.repository }}
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      with:
        version: latest
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Dependencies
      run: uv sync --frozen --no-dev && uv run python -m cloakbrowser install
    - name: Existing production proxy pool
      env:
        PROXY_SUBSCRIPTION_URL: ${{ secrets.PROXY_SUBSCRIPTION_URL }}
        PROXY_TEST_URL: https://www.sheapi.top/api/status
        MIHOMO_VERSION: v1.19.27
        PROXY_REQUIRED: 'true'
      run: bash scripts/setup_mihomo_proxy.sh
    - name: Only four named accounts; compare proxy and direct
      env:
        ANYROUTER_ACCOUNTS: ${{ secrets.ANYROUTER_ACCOUNTS }}
        EXTRA_ACCOUNTS: ${{ secrets.EXTRA_ACCOUNTS }}
        EXTRA_ACCOUNTS_3: ${{ secrets.EXTRA_ACCOUNTS_3 }}
        EXTRA_ACCOUNTS_4: ${{ secrets.EXTRA_ACCOUNTS_4 }}
        EXTRA_ACCOUNTS_5: ${{ secrets.EXTRA_ACCOUNTS_5 }}
        EXTRA_ACCOUNTS_6: ${{ secrets.EXTRA_ACCOUNTS_6 }}
        EXTRA_ACCOUNTS_9: ${{ secrets.EXTRA_ACCOUNTS_9 }}
        EXTRA_ACCOUNTS_10: ${{ secrets.EXTRA_ACCOUNTS_10 }}
        EXTRA_ACCOUNTS_11: ${{ secrets.EXTRA_ACCOUNTS_11 }}
        EXTRA_ACCOUNTS_12: ${{ secrets.EXTRA_ACCOUNTS_12 }}
        EXTRA_ACCOUNTS_13: ${{ secrets.EXTRA_ACCOUNTS_13 }}
        EXTRA_ACCOUNTS_14: ${{ secrets.EXTRA_ACCOUNTS_14 }}
        EXTRA_ACCOUNTS_16: ${{ secrets.EXTRA_ACCOUNTS_16 }}
        EXTRA_ACCOUNTS_19: ${{ secrets.EXTRA_ACCOUNTS_19 }}
        EXTRA_ACCOUNTS_20: ${{ secrets.EXTRA_ACCOUNTS_20 }}
        EXTRA_ACCOUNTS_21: ${{ secrets.EXTRA_ACCOUNTS_21 }}
        EXTRA_ACCOUNTS_23: ${{ secrets.EXTRA_ACCOUNTS_23 }}
        EXTRA_ACCOUNTS_26: ${{ secrets.EXTRA_ACCOUNTS_26 }}
        EXTRA_ACCOUNTS_33: ${{ secrets.EXTRA_ACCOUNTS_33 }}
        EXTRA_ACCOUNTS_34: ${{ secrets.EXTRA_ACCOUNTS_34 }}
        EXTRA_ACCOUNTS_36: ${{ secrets.EXTRA_ACCOUNTS_36 }}
        EXTRA_ACCOUNTS_37: ${{ secrets.EXTRA_ACCOUNTS_37 }}
        EXTRA_ACCOUNTS_38: ${{ secrets.EXTRA_ACCOUNTS_38 }}
        EXTRA_ACCOUNTS_39: ${{ secrets.EXTRA_ACCOUNTS_39 }}
        EXTRA_ACCOUNTS_40: ${{ secrets.EXTRA_ACCOUNTS_40 }}
        EXTRA_ACCOUNTS_41: ${{ secrets.EXTRA_ACCOUNTS_41 }}
        EXTRA_ACCOUNTS_42: ${{ secrets.EXTRA_ACCOUNTS_42 }}
        EXTRA_ACCOUNTS_43: ${{ secrets.EXTRA_ACCOUNTS_43 }}
        EXTRA_ACCOUNTS_44: ${{ secrets.EXTRA_ACCOUNTS_44 }}
        EXTRA_ACCOUNTS_45: ${{ secrets.EXTRA_ACCOUNTS_45 }}
        EXTRA_ACCOUNTS_46: ${{ secrets.EXTRA_ACCOUNTS_46 }}
        EXTRA_ACCOUNTS_47: ${{ secrets.EXTRA_ACCOUNTS_47 }}
        EXTRA_ACCOUNTS_48: ${{ secrets.EXTRA_ACCOUNTS_48 }}
        EXTRA_ACCOUNTS_49: ${{ secrets.EXTRA_ACCOUNTS_49 }}
        EXTRA_ACCOUNTS_50: ${{ secrets.EXTRA_ACCOUNTS_50 }}
        EXTRA_ACCOUNTS_51: ${{ secrets.EXTRA_ACCOUNTS_51 }}
        EXTRA_ACCOUNTS_52: ${{ secrets.EXTRA_ACCOUNTS_52 }}
        EXTRA_ACCOUNTS_53: ${{ secrets.EXTRA_ACCOUNTS_53 }}
        EXTRA_ACCOUNTS_54: ${{ secrets.EXTRA_ACCOUNTS_54 }}
        EXTRA_ACCOUNTS_55: ${{ secrets.EXTRA_ACCOUNTS_55 }}
        EXTRA_ACCOUNTS_56: ${{ secrets.EXTRA_ACCOUNTS_56 }}
        EXTRA_ACCOUNTS_57: ${{ secrets.EXTRA_ACCOUNTS_57 }}
        EXTRA_ACCOUNTS_58: ${{ secrets.EXTRA_ACCOUNTS_58 }}
        EXTRA_ACCOUNTS_59: ${{ secrets.EXTRA_ACCOUNTS_59 }}
        EXTRA_ACCOUNTS_60: ${{ secrets.EXTRA_ACCOUNTS_60 }}
        EXTRA_ACCOUNTS_61: ${{ secrets.EXTRA_ACCOUNTS_61 }}
        EXTRA_ACCOUNTS_62: ${{ secrets.EXTRA_ACCOUNTS_62 }}
        PROVIDERS: ${{ secrets.PROVIDERS }}
        EXTRA_PROVIDERS: ${{ secrets.EXTRA_PROVIDERS }}
        PYTHONUNBUFFERED: '1'
        DEBUG_MODE: 'false'
        CHECKIN_TIMEZONE: Asia/Shanghai
        CHECKIN_WAIT_TIMEOUT_MS: '45000'
        CHECKIN_HEADLESS: 'true'
      run: uv run python -m scripts.check_failed_routes
    - name: Stop diagnostic proxy
      if: always()
      run: bash scripts/stop_mihomo_proxy.sh
