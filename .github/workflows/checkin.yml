name: Failed check-in accounts - isolated human-verification gate
on:
  workflow_dispatch:
concurrency:
  group: checkin-session-state-${{ github.repository }}
  cancel-in-progress: false
jobs:
  failed-checkin-once:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/run/failed-checkin-20261023' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      with:
        version: "latest"
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - run: uv sync --frozen --no-dev
    - uses: actions/cache/restore@v5
      with:
        path: ~/.cloakbrowser
        key: ${{ runner.os }}-cloakbrowser-v1
    - run: uv run python -m cloakbrowser install
    - name: Check exactly three failed accounts and stop before human verification
      env:
        PYTHONUNBUFFERED: '1'
        CHECKIN_TIMEZONE: Asia/Shanghai
        CHECKIN_HEADLESS: 'false'
        CHECKIN_HUMANIZE: 'true'
        CHECKIN_WAIT_TIMEOUT_MS: '120000'
        XIAOBAI_TOKEN_STATE_KEY: ${{ secrets.XIAOBAI_TOKEN_STATE_KEY }}
        XIAOBAI_STATE_GITHUB_TOKEN: ${{ github.token }}
        EXTRA_ACCOUNTS_94: ${{ secrets.EXTRA_ACCOUNTS_94 }}
        EXTRA_ACCOUNTS_97: ${{ secrets.EXTRA_ACCOUNTS_97 }}
        EXTRA_ACCOUNTS_9: ${{ secrets.EXTRA_ACCOUNTS_9 }}
        EXTRA_ACCOUNTS_54: ${{ secrets.EXTRA_ACCOUNTS_54 }}
        EXTRA_ACCOUNTS_55: ${{ secrets.EXTRA_ACCOUNTS_55 }}
        EXTRA_ACCOUNTS_56: ${{ secrets.EXTRA_ACCOUNTS_56 }}
        PROVIDERS: ${{ secrets.PROVIDERS }}
        EXTRA_PROVIDERS: ${{ secrets.EXTRA_PROVIDERS }}
      run: xvfb-run -a --server-args="-screen 0 1920x1080x24" uv run python -m scripts.failed_checkin_once
    - name: Save non-secret account outcomes
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: scoped-checkin-outcomes-${{ github.run_id }}
        path: scoped-checkin-results.json
        if-no-files-found: warn
        retention-days: 3
