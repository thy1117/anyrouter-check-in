name: Nexa www isolated status retry
on:
  workflow_dispatch:
    inputs:
      target_accounts:
        type: string
        default: ''
concurrency:
  group: checkin-session-state-${{ github.repository }}
  cancel-in-progress: false
jobs:
  nexa-www-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      with:
        version: latest
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - run: uv sync --frozen --no-dev
    - name: Read exactly nine failed Nexa account statuses on www
      env:
        PYTHONUNBUFFERED: '1'
        CHECKIN_TIMEZONE: Asia/Shanghai
        XIAOBAI_TOKEN_STATE_KEY: ${{ secrets.XIAOBAI_TOKEN_STATE_KEY }}
        XIAOBAI_STATE_GITHUB_TOKEN: ${{ github.token }}
        PROVIDERS: ${{ secrets.PROVIDERS }}
        EXTRA_PROVIDERS: ${{ secrets.EXTRA_PROVIDERS }}
        EXTRA_ACCOUNTS_64: ${{ secrets.EXTRA_ACCOUNTS_64 }}
        EXTRA_ACCOUNTS_65: ${{ secrets.EXTRA_ACCOUNTS_65 }}
        EXTRA_ACCOUNTS_83: ${{ secrets.EXTRA_ACCOUNTS_83 }}
        EXTRA_ACCOUNTS_84: ${{ secrets.EXTRA_ACCOUNTS_84 }}
        EXTRA_ACCOUNTS_85: ${{ secrets.EXTRA_ACCOUNTS_85 }}
        EXTRA_ACCOUNTS_86: ${{ secrets.EXTRA_ACCOUNTS_86 }}
        EXTRA_ACCOUNTS_87: ${{ secrets.EXTRA_ACCOUNTS_87 }}
        EXTRA_ACCOUNTS_88: ${{ secrets.EXTRA_ACCOUNTS_88 }}
        EXTRA_ACCOUNTS_89: ${{ secrets.EXTRA_ACCOUNTS_89 }}
        EXTRA_ACCOUNTS_90: ${{ secrets.EXTRA_ACCOUNTS_90 }}
        EXTRA_ACCOUNTS_91: ${{ secrets.EXTRA_ACCOUNTS_91 }}
        EXTRA_ACCOUNTS_92: ${{ secrets.EXTRA_ACCOUNTS_92 }}
        EXTRA_ACCOUNTS_93: ${{ secrets.EXTRA_ACCOUNTS_93 }}
        EXTRA_ACCOUNTS_94: ${{ secrets.EXTRA_ACCOUNTS_94 }}
        EXTRA_ACCOUNTS_95: ${{ secrets.EXTRA_ACCOUNTS_95 }}
        EXTRA_ACCOUNTS_96: ${{ secrets.EXTRA_ACCOUNTS_96 }}
        EXTRA_ACCOUNTS_97: ${{ secrets.EXTRA_ACCOUNTS_97 }}
      run: uv run python -m scripts.retry_nexa_www
    - name: Upload non-secret account results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nexa-www-results
        path: nexa-www-results.json
        if-no-files-found: error
        retention-days: 7
