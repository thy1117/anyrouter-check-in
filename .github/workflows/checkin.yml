name: AnyRouter identity-only diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  anyrouter-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    steps:
      - name: Read AnyRouter identity metadata only
        env:
          ANYROUTER_ACCOUNTS: ${{ secrets.ANYROUTER_ACCOUNTS }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          accounts = json.loads(os.environ['ANYROUTER_ACCOUNTS'])
          if not isinstance(accounts, list) or len(accounts) != 1:
              raise SystemExit('Expected exactly one AnyRouter account; no changes made')
          account = accounts[0]
          if account.get('provider', 'anyrouter') != 'anyrouter':
              raise SystemExit('Unexpected provider; no changes made')
          print(json.dumps({
              'name': account.get('name'),
              'provider': account.get('provider', 'anyrouter'),
              'api_user': account.get('api_user'),
              'has_session_cookie': bool(account.get('cookies')),
              'has_access_token': bool(account.get('access_token') or account.get('token') or account.get('accessToken')),
              'has_password_login': bool((account.get('username') or account.get('email')) and account.get('password')),
          }, ensure_ascii=False))
          print('Metadata only: no site requests, check-ins, other account Secrets, or credential output.')
          PYCODE
