name: Xiaobai read-only authentication diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install the same HTTPX version
        run: python -m pip install 'httpx[http2]==0.28.1' --quiet
      - name: Start pinned Oracle SG
        timeout-minutes: 2
        env:
          PROXY_SUBSCRIPTION_URL: ''
          PROXY_NODES: ${{ secrets.PROXY_NODES_XIAOBAI_ORACLE_SG }}
          PROXY_TEST_URL: https://token.dialoguedui.com/custom/checkin_bonus_user
          PROXY_NODE_NAME: oracle-sg
          MIHOMO_VERSION: v1.19.27
          PROXY_REQUIRED: true
        run: bash scripts/setup_mihomo_proxy.sh
      - name: Read-only one-account authentication probes
        timeout-minutes: 2
        env:
          EXTRA_ACCOUNTS_16: ${{ secrets.EXTRA_ACCOUNTS_16 }}
          EXTRA_ACCOUNTS_13: ${{ secrets.EXTRA_ACCOUNTS_13 }}
        run: |
          python - <<'PY_DIAGNOSTIC'
          """Single-account diagnostics: no check-in and no real-token refresh."""
          import base64
          import datetime as dt
          import json
          import os
          import time

          import httpx

          BASE = 'https://token.dialoguedui.com'
          DUMMY = 'diagnostic-not-a-real-token'
          DUMMY_REFRESH = {'refresh_token': 'diagnostic-invalid-refresh-token'}
          account = None
          for slot in ('EXTRA_ACCOUNTS_16', 'EXTRA_ACCOUNTS_13'):
              raw = os.environ.get(slot, '')
              if not raw:
                  continue
              entries = json.loads(raw)
              if isinstance(entries, dict):
                  entries = [entries]
              candidate = next((a for a in entries if a.get('provider') == 'xiaobai'), None)
              if candidate is not None:
                  account = candidate
                  break
          if account is None:
              raise SystemExit('No Xiaobai account in the two scoped slots; no account requests were made.')

          access = account.get('access_token') or ''
          refresh = account.get('refresh_token') or ''
          for secret in (access, refresh):
              if secret:
                  print(f'::add-mask::{secret}')
          now = dt.datetime.now(dt.timezone.utc)
          info = {
              'kind': 'single_account_metadata',
              'provider': 'xiaobai',
              'has_access_token': bool(access),
              'has_refresh_token': bool(refresh),
              'now_utc': now.isoformat(),
              'real_refresh_performed': False,
              'checkin_performed': False,
          }
          try:
              payload = access.split('.')[1]
              claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
              exp = float(claims['exp'])
              info['unverified_jwt_exp_utc'] = dt.datetime.fromtimestamp(exp, dt.timezone.utc).isoformat()
              info['unverified_jwt_expired'] = exp < now.timestamp()
          except (ValueError, IndexError, KeyError, TypeError):
              info['unverified_jwt_exp_utc'] = None
          print(json.dumps(info, ensure_ascii=False), flush=True)

          proxy = os.environ['CHECKIN_PROXY_URL']
          HEADERS = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36',
              'Accept': 'application/json',
              'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
              'Content-Type': 'application/json',
              'Origin': BASE,
              'Referer': BASE + '/checkin/',
          }


          def probe(label, route, token='', http2=True, method='GET', body=None):
              if method == 'GET':
                  assert route in ('/checkin/api/status', '/api/v1/auth/me')
              else:
                  assert method == 'POST' and route in ('/auth/refresh', '/api/v1/auth/refresh')
                  assert not token and body == DUMMY_REFRESH
              headers = dict(HEADERS)
              if token:
                  headers['Authorization'] = 'Bearer ' + token
              started = time.monotonic()
              result = {'kind': 'probe', 'case': label, 'method': method, 'path': route, 'http2_enabled': http2}
              try:
                  with httpx.Client(proxy=proxy, trust_env=False, http2=http2, timeout=15.0, headers=headers) as client:
                      response = client.request(method, BASE + route, json=body) if body is not None else client.get(BASE + route)
                  result.update({
                      'status': response.status_code,
                      'http_version': response.http_version,
                      'content_type': response.headers.get('content-type'),
                      'server': response.headers.get('server'),
                      'cf_ray': response.headers.get('cf-ray'),
                      'origin_marker': response.headers.get('x-api0-origin'),
                  })
                  try:
                      payload = response.json()
                  except ValueError:
                      result['body_kind'] = 'html' if '<html' in response.text[:200].lower() or '<!doctype' in response.text[:200].lower() else 'non_json'
                  else:
                      if isinstance(payload, dict):
                          for key in ('code', 'ok', 'message', 'reason', 'error_code', 'error_category', 'title'):
                              value = payload.get(key)
                              if isinstance(value, (str, int, bool)):
                                  if isinstance(value, str):
                                      for secret in (access, refresh):
                                          if secret:
                                              value = value.replace(secret, '[REDACTED]')
                                      value = value[:200]
                                  result[key] = value
                          data = payload.get('data')
                          if route == '/checkin/api/status' and isinstance(data, dict):
                              result['signedToday'] = data.get('signedToday')
              except Exception as exc:
                  result['exception_type'] = type(exc).__name__
              result['seconds'] = round(time.monotonic() - started, 3)
              print(json.dumps(result, ensure_ascii=False), flush=True)


          probe('no_auth_h1', '/checkin/api/status', http2=False)
          probe('no_auth_h2', '/checkin/api/status', http2=True)
          probe('dummy_auth_h2', '/checkin/api/status', token=DUMMY)
          if access:
              probe('saved_auth_h1', '/checkin/api/status', token=access, http2=False)
              probe('saved_auth_h2', '/checkin/api/status', token=access, http2=True)
              probe('saved_auth_main_api', '/api/v1/auth/me', token=access)
          probe('wrong_refresh_path_dummy_only', '/auth/refresh', method='POST', body=DUMMY_REFRESH)
          probe('correct_refresh_path_dummy_only', '/api/v1/auth/refresh', method='POST', body=DUMMY_REFRESH)
          print(json.dumps({'kind': 'finished', 'accounts_used': 1, 'checkin_performed': False, 'real_refresh_performed': False}), flush=True)
          PY_DIAGNOSTIC
      - name: Stop the isolated proxy
        if: always()
        run: bash scripts/stop_mihomo_proxy.sh
